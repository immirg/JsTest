<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="userDetails.js" defer></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            min-width: 1300px;
            justify-content: center;
            background: #5572cf;
        }
        .wrapper {
            border: 1px black solid;
            width: 90%;
            height: 690px;
            background: #ffffff;
        }
        .card {
            padding: 10px 0 50px 30px;
        }
        .title {
            display: none;
            width: 100%;
            border: 1px black solid;
            background: #efdcdc;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .address, .geo, .company {
            padding-left: 30px;
        }
        .postOfCurrentUser {
            display: block;
            width: 100%;
            margin: 20px auto;
            height: 40px;
            background: #7a3a3a;
            color: white;
            font-size: 25px;
        }
    </style>
</head>
<body>
<div class="wrapper" id="wrapper">
    <div class="card">
        <p class="id" id="id"></p>
        <p class="name" id="name"></p>
        <p class="userName" id="userName"></p>
        <p class="email" id="email"></p>
        <p><b>address</b></p>

        <div class="address" id="address">
            <p class="street" id="street"></p>
            <p class="suite" id="suite"></p>
            <p class="city" id="city"></p>
            <p class="zipcode" id="zipcode"></p>
            <p><b>geo</b></p>
            <div class="geo" id="geo">
                <p class="lat" id="lat"></p>
                <p class="lng" id="lng"></p>
            </div>
        </div>

        <p class="phone" id="phone"></p>
        <p class="website" id="website"></p>
        <p><b>company</b></p>
        <div class="company" id="company">
            <p class="companyName" id="companyName"></p>
            <p class="catchPhrase" id="catchPhrase"></p>
            <p class="bs" id="bs"></p>
        </div>
    </div>
    <button class="postOfCurrentUser" id="postOfCurrentUser">post of current user</button>
    <div class="title" id="title"></div>
</div>
</body>
</html>
