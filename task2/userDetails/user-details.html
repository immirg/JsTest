<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="userDetails.js" defer></script>
    <link rel="stylesheet" href="style-user-details.css">
</head>
<body>
<div class="wrapper" id="wrapper">
    <div class="card">
        <p class="id" id="id"></p>
        <p class="name" id="name"></p>
        <p class="userName" id="userName"></p>
        <p class="email" id="email"></p>
        <p><b>address</b></p>

        <div class="address" id="address">
            <p class="street" id="street"></p>
            <p class="suite" id="suite"></p>
            <p class="city" id="city"></p>
            <p class="zipcode" id="zipcode"></p>
            <p><b>geo</b></p>
            <div class="geo" id="geo">
                <p class="lat" id="lat"></p>
                <p class="lng" id="lng"></p>
            </div>
        </div>

        <p class="phone" id="phone"></p>
        <p class="website" id="website"></p>
        <p><b>company</b></p>
        <div class="company" id="company">
            <p class="companyName" id="companyName"></p>
            <p class="catchPhrase" id="catchPhrase"></p>
            <p class="bs" id="bs"></p>
        </div>
    </div>
    <button class="postOfCurrentUser" id="postOfCurrentUser">post of current user</button>
    <div class="title" id="title"></div>
</div>
</body>
</html>
